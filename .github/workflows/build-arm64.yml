name: build-arm64
on:
  push:
    tags:
      - v*
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
      - name: Build FFmpeg arm64
        run: |
          git clone https://github.com/FFmpeg/FFmpeg ffmpeg
          cd ffmpeg
          ./configure --target-os=android --arch=aarch64 --enable-cross-compile --cc=$[STRIPPED 88 bytes] --disable-programs --disable-doc --enable-static --disable-shared --extra-ldflags="-Wl,-z,max-page-size=16384"
          make -j$(nproc)
      - name: Build scanner
        run: |
          cmake -S native -B build -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DFFMPEG_DIR=$PWD/ffmpeg
          cmake --build build -j$(nproc)
      - name: Check 16KB alignment
        run: |
          for so in $(find build -name "*.so"); do echo "$so:"; aarch64-linux-android-readelf -l $so | grep -i align; done
      - uses: actions/upload-artifact@v4
        with:
          name: libreplaygain_scanner-arm64
          path: build/libreplaygain_scanner.so
